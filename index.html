<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kubuntu Web Cloud Dashboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-shadow: 0px 4px 12px rgba(0, 0, 0, 0.6);
    }

    #time {
      font-size: 7rem;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 0.5rem;
    }

    #date {
      font-size: 2rem;
      font-weight: 400;
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    #weather {
      font-size: 1.5rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div id="time">00:00</div>
    <div id="date">Loading Date...</div>
    <div id="weather">Walla Walla: Syncing...</div>
  </div>

  <script>
    // 1. Interactive Slideshow Backgrounds
    const images = [
      "https://unsplash.com",
      "https://unsplash.com"
    ];
    let idx = 0;

    function nextSlide() {
      document.body.style.backgroundImage = `url('${images[idx]}')`;
      idx = (idx + 1) % images.length;
    }
    nextSlide();
    setInterval(nextSlide, 30000);

    // 2. Real-Time System Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 3. Clear Network API Request (Allowed natively over HTTPS hosting)
    async function loadLocalWeather() {
      try {
        const lat = "46.0656"; 
        const lon = "-118.3186";
        const cityName = "Walla Walla"; 

        const weatherUrl = `https://open-meteo.com{lat}&longitude=${lon}&current=temperature_2m&temperature_unit=fahrenheit`;
        
        const weatherResponse = await fetch(weatherUrl);
        const weatherData = await weatherResponse.json();
        
        const temp = Math.round(weatherData.current.temperature_2m);
        document.getElementById('weather').textContent = `${cityName}: ${temp}°F`;
      } catch (error) {
        document.getElementById('weather').textContent = "Weather connection lost";
        console.error(error);
      }
    }
    
    loadLocalWeather();
    setInterval(loadLocalWeather, 900000); // Update every 15 minutes
  </script>
</body>
</html>
